<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250" role="img" aria-label="DEV_MITOLENDA — mitolenda.dev">
  <style>
    .paper { fill: #F2EFE7; }
    .ink { fill: #0D0D0D; }
    .accent { fill: #D6220F; }
    .kicker {
      font-family: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.14em;
      fill: #6E6A63;
    }
    .cover {
      font-family: 'Big Shoulders Display', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .sticker-text {
      font-family: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>

  <!-- fundo chapado — sem gradiente, sem textura -->
  <rect width="800" height="250" class="paper" />

  <!-- kicker: crédito mono, maiúscula permitida só aqui -->
  <text x="40" y="40" class="kicker">MITOLENDA.DEV</text>
  <text x="760" y="40" class="kicker" text-anchor="end">SYSTEM DESIGN PORTFOLIO</text>

  <!-- régua pesada — assinatura visual, acima da manchete -->
  <rect x="40" y="52" width="720" height="4" class="ink" />

  <!-- manchete-capa: marca centrada, colchetes em vermelho como único acento -->
  <text x="400" y="150" text-anchor="middle" class="cover ink" style="font-size:58px;">
    <tspan class="accent">[</tspan> DEV_MITOLENDA <tspan class="accent">]</tspan>
  </text>

  <!-- régua pesada — abaixo da manchete -->
  <rect x="40" y="180" width="720" height="4" class="ink" />

  <!-- stickers: etiqueta mono inclinada — máximo dois -->
  <g transform="rotate(3 155 213)">
    <rect x="97" y="199" width="116" height="28" fill="#0D0D0D" />
    <text x="155" y="217" text-anchor="middle" class="sticker-text" fill="#F2EFE7">system design</text>
  </g>

  <g transform="rotate(-2.5 645 213)">
    <rect x="583" y="199" width="124" height="28" fill="#FF5A00" stroke="#0D0D0D" stroke-width="1" />
    <text x="645" y="217" text-anchor="middle" class="sticker-text" fill="#0D0D0D">mitolenda.dev</text>
  </g>
</svg>
